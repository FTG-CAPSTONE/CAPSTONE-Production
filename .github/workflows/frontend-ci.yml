name: Frontend CI — Type-check + Build

on:
  push:
    branches: [main, development]
    paths:
      - "claimgaurd-frontend/**"
      - ".github/workflows/frontend-ci.yml"
  pull_request:
    branches: [main, development]
    paths:
      - "claimgaurd-frontend/**"
      - ".github/workflows/frontend-ci.yml"

defaults:
  run:
    working-directory: claimgaurd-frontend

jobs:
  build:
    name: Type-check + Build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: claimgaurd-frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build (type-check + production build)
        run: npm run build
        env:
          NEXT_TELEMETRY_DISABLED: 1
          # Dummy backend URL so next.config.ts proxy rewrite resolves during build
          BACKEND_URL: http://localhost:8000

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: nextjs-build
          path: claimgaurd-frontend/.next/
          retention-days: 3
