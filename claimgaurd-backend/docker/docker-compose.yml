version: "3.9"

services:
  # ── Database migrations (one-shot, runs before API starts) ─────────────────
  migrate:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: claimguard-migrate
    command: alembic upgrade head
    env_file:
      - ../.env
    environment:
      DATABASE_URL: "postgresql+psycopg2://claimguard:cg_secure_2026@postgres:5432/claimguard"
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  # ── API Server ─────────────────────────────────────────────────────────────
  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: claimguard-api
    ports:
      - "8000:8000"
    env_file:
      - ../.env
    environment:
      DATABASE_URL: "postgresql+psycopg2://claimguard:cg_secure_2026@postgres:5432/claimguard"
      ASYNC_DATABASE_URL: "postgresql+asyncpg://claimguard:cg_secure_2026@postgres:5432/claimguard"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/2"
      OBJECT_STORAGE_ENDPOINT: "http://minio:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s
    restart: unless-stopped

  # ── Celery Worker ──────────────────────────────────────────────────────────
  worker:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: claimguard-worker
    command: >
      celery -A workers.celery_app worker
      --loglevel=info
      -Q default,etl,ml,notifications
      --concurrency=4
    env_file:
      - ../.env
    environment:
      DATABASE_URL: "postgresql+psycopg2://claimguard:cg_secure_2026@postgres:5432/claimguard"
      ASYNC_DATABASE_URL: "postgresql+asyncpg://claimguard:cg_secure_2026@postgres:5432/claimguard"
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/2"
      OBJECT_STORAGE_ENDPOINT: "http://minio:9000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ── Celery Beat Scheduler ──────────────────────────────────────────────────
  beat:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: claimguard-beat
    command: celery -A workers.celery_app beat --loglevel=info
    env_file:
      - ../.env
    environment:
      REDIS_URL: "redis://redis:6379/0"
      CELERY_BROKER_URL: "redis://redis:6379/1"
      CELERY_RESULT_BACKEND: "redis://redis:6379/2"
    depends_on:
      - redis
    restart: unless-stopped

  # ── PostgreSQL ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: claimguard-postgres
    environment:
      POSTGRES_DB: claimguard
      POSTGRES_USER: claimguard
      POSTGRES_PASSWORD: "cg_secure_2026"
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U claimguard -d claimguard"]
      interval: 5s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  # ── Redis ──────────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: claimguard-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5
    restart: unless-stopped

  # ── MinIO (S3-compatible object storage) ──────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: claimguard-minio
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - miniodata:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # ── Frontend (optional — build and serve) ─────────────────────────────────
  # Uncomment to include frontend in docker compose stack:
  # frontend:
  #   build:
  #     context: ../claimgaurd-frontend
  #     dockerfile: Dockerfile  # add a Dockerfile to claimgaurd-frontend/
  #   container_name: claimguard-frontend
  #   ports:
  #     - "3000:3000"
  #   environment:
  #     BACKEND_URL: http://api:8000
  #     JWT_SECRET: ${SECRET_KEY}
  #   depends_on:
  #     api:
  #       condition: service_healthy

volumes:
  pgdata:
  miniodata:

networks:
  default:
    name: claimguard-network
