##############################################################################
# ClaimGuard — Render Blueprint
# Docs: https://render.com/docs/blueprint-spec
#
# Services defined here:
#   1. api          — FastAPI web service (public)
#   2. worker       — Celery worker (background, private)
#   3. beat         — Celery beat scheduler (background, private)
#   4. claimguard-db   — Managed PostgreSQL
#   5. claimguard-redis — Managed Redis
#
# Deploy:
#   render blueprint launch  (from the Render dashboard → New → Blueprint)
##############################################################################

databases:
  - name: claimguard-db
    databaseName: claimguard
    user: claimguard
    plan: free          # upgrade to starter ($7/mo) for persistent storage
    region: oregon      # change to frankfurt or singapore if closer to your users

services:
  # ── Managed Redis ──────────────────────────────────────────────────────────
  - type: redis
    name: claimguard-redis
    plan: free          # upgrade to starter for persistence
    region: oregon
    maxmemoryPolicy: allkeys-lru

  # ── FastAPI Web Service ────────────────────────────────────────────────────
  - type: web
    name: claimguard-api
    runtime: python
    region: oregon
    plan: free          # upgrade to starter ($7/mo) for always-on + more RAM

    rootDir: .          # repo root IS the backend (see Step 1 in the guide)
    buildCommand: pip install -r requirements.txt
    startCommand: >
      uvicorn app.main:app
      --host 0.0.0.0
      --port $PORT
      --workers 2
    healthCheckPath: /health

    envVars:
      # ── App ────────────────────────────────────────────────────────────────
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        generateValue: true          # Render auto-generates a secure random value
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "15"
      - key: REFRESH_TOKEN_EXPIRE_DAYS
        value: "7"
      # Replace with your actual Vercel frontend URL after it is deployed
      - key: CORS_ORIGINS_STR
        value: "https://your-frontend.vercel.app,https://claimguard.co.ke"

      # ── Database (injected from the managed DB above) ─────────────────────
      - key: DATABASE_URL
        fromDatabase:
          name: claimguard-db
          property: connectionString
      # asyncpg variant — Render only gives one connection string so we derive
      # the async URL by replacing the driver prefix at runtime (see note below)
      - key: ASYNC_DATABASE_URL
        fromDatabase:
          name: claimguard-db
          property: connectionString   # migrations/env.py already normalises drivers

      # ── Redis (injected from the managed Redis above) ─────────────────────
      - key: REDIS_URL
        fromService:
          type: redis
          name: claimguard-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: claimguard-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: claimguard-redis
          property: connectionString

      # ── Object Storage ─────────────────────────────────────────────────────
      # Option A — keep using MinIO hosted elsewhere (fill in the URL)
      # Option B — switch to AWS S3 (replace keys below with S3 values)
      - key: OBJECT_STORAGE_ENDPOINT
        value: ""           # e.g. https://s3.amazonaws.com  or your MinIO URL
      - key: OBJECT_STORAGE_ACCESS_KEY
        value: ""
      - key: OBJECT_STORAGE_SECRET_KEY
        value: ""
      - key: OBJECT_STORAGE_BUCKET
        value: "claimguard-docs"
      - key: OBJECT_STORAGE_USE_SSL
        value: "true"

      # ── InsureMaster ───────────────────────────────────────────────────────
      - key: INSUREMASTER_MODE
        value: faker        # keep as "faker" until InsureMaster is ready
      - key: INSUREMASTER_BASE_URL
        value: ""
      - key: INSUREMASTER_API_KEY
        value: ""

      # ── Dev seed endpoint — MUST be false in production ───────────────────
      - key: ENABLE_DEV_SEED_ENDPOINT
        value: "false"

      # ── Notifications ──────────────────────────────────────────────────────
      - key: SMTP_HOST
        value: smtp.gmail.com
      - key: SMTP_PORT
        value: "587"
      - key: SMTP_USERNAME
        value: ""
      - key: SMTP_PASSWORD
        value: ""
      - key: NOTIFICATION_FROM_EMAIL
        value: noreply@claimguard.co.ke
      - key: AT_API_KEY
        value: ""
      - key: AT_USERNAME
        value: sandbox
      - key: AT_SENDER_ID
        value: ClaimGuard

  # ── Celery Worker (background service — no public port) ───────────────────
  - type: worker
    name: claimguard-worker
    runtime: python
    region: oregon
    plan: free

    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: >
      celery -A workers.celery_app worker
      --loglevel=info
      -Q default,etl,ml,notifications
      --concurrency=2

    envVars:
      - key: APP_ENV
        value: production
      - key: SECRET_KEY
        fromService:
          type: web
          name: claimguard-api
          envVarKey: SECRET_KEY
      - key: DATABASE_URL
        fromDatabase:
          name: claimguard-db
          property: connectionString
      - key: ASYNC_DATABASE_URL
        fromDatabase:
          name: claimguard-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          type: redis
          name: claimguard-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: claimguard-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: claimguard-redis
          property: connectionString
      - key: OBJECT_STORAGE_ENDPOINT
        value: ""
      - key: OBJECT_STORAGE_ACCESS_KEY
        value: ""
      - key: OBJECT_STORAGE_SECRET_KEY
        value: ""
      - key: OBJECT_STORAGE_BUCKET
        value: "claimguard-docs"
      - key: INSUREMASTER_MODE
        value: faker

  # ── Celery Beat Scheduler ─────────────────────────────────────────────────
  - type: worker
    name: claimguard-beat
    runtime: python
    region: oregon
    plan: free

    rootDir: .
    buildCommand: pip install -r requirements.txt
    startCommand: celery -A workers.celery_app beat --loglevel=info

    envVars:
      - key: APP_ENV
        value: production
      - key: REDIS_URL
        fromService:
          type: redis
          name: claimguard-redis
          property: connectionString
      - key: CELERY_BROKER_URL
        fromService:
          type: redis
          name: claimguard-redis
          property: connectionString
      - key: CELERY_RESULT_BACKEND
        fromService:
          type: redis
          name: claimguard-redis
          property: connectionString
      - key: INSUREMASTER_MODE
        value: faker
